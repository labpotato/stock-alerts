name: Deploy Telegram Q&A bot
# Deploys bot/ to Cloudflare Workers, copies the bot's secrets from this repository's secrets,
# and points the Telegram bot's webhook at it. Does nothing until the Cloudflare secrets exist.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [bot/**, .github/workflows/bot-deploy.yml]
permissions:
  contents: read
concurrency:
  group: bot-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - name: Check the secrets are in place
        id: ready
        # The raw secrets reach this step only. It passes cleaned, masked copies to later steps.
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          TG_TOKEN:              ${{ secrets.TG_TOKEN }}
          TG_CHAT:               ${{ secrets.TG_CHAT }}
        run: |
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ANTHROPIC_API_KEY TG_TOKEN TG_CHAT; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::notice::Bot not deployed yet. Missing repository secrets:$missing"
            echo "go=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A pasted secret often carries a stray line break or space. Spaces at the ends are
          # trimmed; one in the middle means two things were pasted, so name the secret and stop.
          bad=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ANTHROPIC_API_KEY TG_TOKEN TG_CHAT; do
            val="${!v}"
            val="${val#"${val%%[![:space:]]*}"}"; val="${val%"${val##*[![:space:]]}"}"
            case "$val" in *[[:space:]]*) bad="$bad $v" ;; esac
            echo "::add-mask::$val"
            { echo "$v<<__END__"; echo "$val"; echo "__END__"; } >> "$GITHUB_ENV"
          done
          if [ -n "$bad" ]; then
            echo "::error::These secrets contain a line break or space in the middle:$bad. Edit each one and paste only the single value, on one line."
            exit 1
          fi
          echo "go=yes" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.go == 'yes'
        with: {node-version: '22'}
      - name: Install and test
        if: steps.ready.outputs.go == 'yes'
        run: npm ci --no-audit --no-fund && npm test
      - name: Deploy the Worker
        if: steps.ready.outputs.go == 'yes'
        id: deploy
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then
            err=$(grep -m1 -A2 'ERROR' deploy.log | tr -d '\033' | sed 's/\[[0-9;]*m//g' | tr '\n' ' ')
            if grep -qi 'workers.dev' deploy.log && grep -qi 'subdomain' deploy.log; then
              echo "::error::Cloudflare needs a workers.dev subdomain: open Workers & Pages in the Cloudflare dashboard once, choose a name, then re-run."
            else
              echo "::error::Cloudflare deploy failed: ${err:-see the log above}"
            fi
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Set the bot's secrets and connect Telegram
        if: steps.ready.outputs.go == 'yes'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          HOLDINGS_JSON: ${{ secrets.HOLDINGS_JSON }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          HOLDINGS_TOKEN: ${{ secrets.HOLDINGS_TOKEN }}
        run: |
          WH=$(openssl rand -hex 24); echo "::add-mask::$WH"
          printf %s "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY >/dev/null
          printf %s "$TG_TOKEN"          | npx wrangler secret put TG_TOKEN >/dev/null
          printf %s "$TG_CHAT"           | npx wrangler secret put TG_CHAT >/dev/null
          printf %s "$WH"                | npx wrangler secret put TG_WEBHOOK_SECRET >/dev/null
          if [ -n "$HOLDINGS_JSON" ]; then printf %s "$HOLDINGS_JSON" | npx wrangler secret put HOLDINGS_JSON >/dev/null; fi
          if [ -n "$HOLDINGS_TOKEN" ]; then
            ht=$(printf %s "$HOLDINGS_TOKEN" | tr -d '[:space:]'); echo "::add-mask::$ht"
            printf %s "$ht" | npx wrangler secret put HOLDINGS_TOKEN >/dev/null
          fi
          if [ -n "$GH_DISPATCH_TOKEN" ]; then
            tok=$(printf %s "$GH_DISPATCH_TOKEN" | tr -d '[:space:]'); echo "::add-mask::$tok"
            printf %s "$tok" | npx wrangler secret put GH_DISPATCH_TOKEN >/dev/null
          else
            echo "::warning::GH_DISPATCH_TOKEN is not set, so the 10-minute heartbeat stays off and the alerter relies on GitHub's own (unreliable) schedule."
          fi
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/setWebhook" \
            --data-urlencode "url=${URL}" --data-urlencode "secret_token=${WH}" \
            --data-urlencode 'allowed_updates=["message"]' -d drop_pending_updates=true \
            | python3 -c "import json,sys; r=json.load(sys.stdin); print('Telegram webhook set:', r.get('ok'), r.get('description',''))"
          echo "::notice::Bot is live. Send /start to your bot in Telegram."
