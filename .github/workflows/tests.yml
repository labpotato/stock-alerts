name: Tests
on:
  pull_request:
  push:
    branches-ignore: [main]
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q pytest
      - run: python -m pytest -q tests
